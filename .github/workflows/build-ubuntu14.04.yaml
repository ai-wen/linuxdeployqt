name: Build linuxdeployqt (Ubuntu 14.04)

on:
  workflow_dispatch:

jobs:
  build:
    name: docker ubuntu:14.04 (glibc 2.19)
    runs-on: ubuntu-latest
    env:
      # linuxdeployqt.pro 读取该变量作为 BUILD_NUMBER
      TRAVIS_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout (full history + tags, for version string)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 不能用 job 级 container: ubuntu:14.04 —— actions/checkout 的 node20
      # 需要 glibc >= 2.28，trusty 只有 2.19。所以在宿主机 checkout，
      # 再把工作区挂载进容器编译。
      - name: Write Qt 5.2 / GCC 4.8 compat shim (qInfo / noquote / foreach)
        run: |
          cat > qt52_compat.h <<'EOF'
          #ifndef QT52_COMPAT_H
          #define QT52_COMPAT_H
          /* Ubuntu 14.04: Qt 5.2 + GCC 4.8 兼容垫片, 经 -include 注入, 不改源码.
           * 1) qInfo() 需要 Qt >= 5.5; QDebug::noquote() 需要 Qt >= 5.4.
           * 2) GCC 4.8 的 Q_FOREACH 病态解析 bug (GCC bug 59244, 4.9 修复):
           *    foreach(x, QStringList(y)) 会被解析成函数声明,
           *    给容器整体加一层括号强制按表达式解析. */
          #include <QDebug>
          #if QT_VERSION < QT_VERSION_CHECK(5, 5, 0)
          inline QDebug qInfo() { return qDebug(); }
          #define noquote space
          #endif
          #if defined(__GNUC__) && !defined(__clang__) && __GNUC__ < 5
          #undef foreach
          #define foreach(variable, container) Q_FOREACH(variable, (container))
          #endif
          #endif
          EOF
          # 保险：去掉可能的 CRLF
          sed -i "s/\r$//" qt52_compat.h

      - name: Build in ubuntu:14.04 container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/ws" \
            -w /ws \
            -e TRAVIS_BUILD_NUMBER \
            ubuntu:14.04 \
            bash -exc '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                build-essential ca-certificates git qtbase5-dev qt5-default file
              qmake -query
              # 注意：make 会进入 tools/linuxdeployqt 子目录编译，
              # -include 必须用绝对路径（$PWD 在容器内即挂载点 /ws）
              qmake CONFIG+=release CONFIG+=force_debug_info CONFIG-=warning_clean \
                    "QMAKE_CXXFLAGS+=-include $PWD/qt52_compat.h" \
                    linuxdeployqt.pro
              make -j$(nproc)
              file bin/linuxdeployqt
              ldd bin/linuxdeployqt
            '

      - name: Upload artifact (plain ELF binary, not AppImage)
        uses: actions/upload-artifact@v4
        with:
          name: linuxdeployqt-ubuntu14.04-x86_64
          path: bin/linuxdeployqt
          if-no-files-found: error
